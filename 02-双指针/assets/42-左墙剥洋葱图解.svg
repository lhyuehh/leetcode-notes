<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <rect width="960" height="440" fill="#ffffff"/>
  <style>
    .title { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 20px; font-weight: 600; fill: #111827; }
    .bad { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 16px; font-weight: 600; fill: #b91c1c; }
    .good { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 16px; font-weight: 600; fill: #065f46; }
    .label { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 14px; fill: #1f2937; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; fill: #1e40af; }
    .muted { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 13px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" class="title">42. 接雨水 病因复盘：左墙不是固定的 left=0，而是“剥洋葱逐层换人”</text>

  <!-- Left: 错误建模 -->
  <rect x="30" y="60" width="420" height="350" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="240" y="92" text-anchor="middle" class="bad">错误建模：在外面写死一个 left = 0</text>
  <text x="240" y="116" text-anchor="middle" class="muted">例子：[5, 2, 1, 3] —— 不同深度的坑，左墙根本不是同一个！</text>

  <!-- Bars [5, 2, 1, 3] -->
  <rect x="95" y="140" width="46" height="140" fill="#374151"/>
  <text x="118" y="298" text-anchor="middle" class="label">5 (idx 0)</text>
  <rect x="155" y="224" width="46" height="56" fill="#374151"/>
  <text x="178" y="298" text-anchor="middle" class="label">2 (idx 1)</text>
  <rect x="215" y="252" width="46" height="28" fill="#374151"/>
  <text x="238" y="298" text-anchor="middle" class="label">1 (idx 2)</text>
  <rect x="275" y="196" width="46" height="84" fill="#374151"/>
  <text x="298" y="298" text-anchor="middle" class="label">3 (idx 3)</text>

  <!-- Water highlights -->
  <rect x="215" y="224" width="46" height="28" fill="#fca5a5" opacity="0.8"/>
  <rect x="155" y="196" width="106" height="28" fill="#bfdbfe" opacity="0.8"/>

  <text x="60" y="336" class="label">• 底部坑 1 需要的是紧邻左墙 <tspan font-weight="600">2</tspan></text>
  <text x="60" y="364" class="label">• 填平到 2 后，新坑 2 需要的是更远的左墙 <tspan font-weight="600">5</tspan></text>
  <text x="60" y="392" class="bad">一个固定变量 left=0 记不住一串阶梯，算宽度必乱！</text>

  <!-- Right: 正确建模 -->
  <rect x="475" y="60" width="455" height="350" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="702" y="92" text-anchor="middle" class="good">正确建模：单调栈 = 把潜在左墙从高到矮摞起来</text>
  <text x="702" y="116" text-anchor="middle" class="muted">核心死定义：左墙 = 弹出槽底后，脚下露出的新栈顶 stack[-1]</text>

  <!-- Stack diagram -->
  <rect x="510" y="148" width="110" height="44" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="565" y="175" text-anchor="middle" class="mono">高1 (idx 2)</text>
  <rect x="510" y="196" width="110" height="44" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <text x="565" y="223" text-anchor="middle" class="mono">高2 (idx 1)</text>
  <rect x="510" y="244" width="110" height="44" fill="#6ee7b7" stroke="#059669" stroke-width="1.5"/>
  <text x="565" y="271" text-anchor="middle" class="mono">高5 (idx 0)</text>
  <text x="565" y="308" text-anchor="middle" class="muted">单调递减栈</text>

  <!-- Peel steps -->
  <line x1="628" y1="170" x2="660" y2="170" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="668" y="166" class="label">第1层剥皮：弹 bottom=1</text>
  <text x="668" y="186" class="mono">脚下露出的左墙 = 2</text>

  <line x1="628" y1="218" x2="660" y2="218" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="668" y="214" class="label">第2层剥皮：弹 bottom=2</text>
  <text x="668" y="234" class="mono">脚下露出的左墙 = 5</text>

  <line x1="628" y1="266" x2="660" y2="266" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="668" y="262" class="label">第3层：弹 5 后栈空</text>
  <text x="668" y="282" class="mono">if not stack: break</text>

  <rect x="505" y="330" width="398" height="62" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="704" y="354" text-anchor="middle" class="label">口诀：先 bottom = stack.pop() 拿槽底</text>
  <text x="704" y="378" text-anchor="middle" class="mono">再看脚下 left = stack[-1]，宽度 = i - left - 1</text>
</svg>
