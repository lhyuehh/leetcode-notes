<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <rect width="960" height="440" fill="#ffffff"/>
  <style>
    .title { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 20px; font-weight: 600; fill: #111827; }
    .h2b { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 16px; font-weight: 600; fill: #1e3a8a; }
    .h2r { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 15.5px; font-weight: 600; fill: #b91c1c; }
    .label { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 14px; fill: #1f2937; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; fill: #1e40af; }
    .muted { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 13px; fill: #6b7280; }
  </style>

  <text x="480" y="36" text-anchor="middle" class="title">560. 和为 K 的子数组：为什么滑窗失效？怎么用前缀和 + 哈希？</text>

  <!-- Top Box: 为什么不能用滑动窗口 -->
  <rect x="36" y="60" width="888" height="72" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="60" y="90" class="h2r">转折点：数组含负数 / 0 → 失去单调性，滑动窗口失效！</text>
  <text x="60" y="116" class="label">右扩时总和可能反而变小，左缩时总和可能反而变大，left 不知道何时该收缩 → 改用「前缀和 + 哈希表（枚举右，维护左）」。</text>

  <!-- Bottom Left: 前缀和转换图解 -->
  <rect x="36" y="152" width="464" height="258" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="268" y="184" text-anchor="middle" class="h2b">核心公式：区间和 = 当前前缀和 - 历史前缀和</text>

  <!-- Segment bars -->
  <rect x="66" y="210" width="404" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="268" y="231" text-anchor="middle" class="mono">cur_sum（0 到当前位置的总和）</text>

  <rect x="66" y="256" width="176" height="32" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="154" y="277" text-anchor="middle" class="mono">pre_sum = cur_sum - k</text>

  <rect x="248" y="256" width="222" height="32" rx="6" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <text x="359" y="277" text-anchor="middle" class="label">目标子数组（和 = k）</text>

  <text x="66" y="326" class="label">等价转化（和 001. 两数之和 完全同源）：</text>
  <text x="66" y="352" class="mono">问：前面一共出现过多少个 pre_sum == cur_sum - k ？</text>
  <text x="66" y="382" class="muted">用 prefix_cnt[s] 记录前缀和 s 出现次数，O(1) 查出！</text>

  <!-- Bottom Right: 2个必避坑 -->
  <rect x="524" y="152" width="400" height="258" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="724" y="184" text-anchor="middle" class="h2r">我最容易犯的 2 个错误</text>

  <text x="548" y="222" class="label" font-weight="600">1. 漏写 prefix_cnt[0] = 1</text>
  <text x="548" y="246" class="muted">空前缀和为 0 默认出现 1 次；不写会漏掉所有</text>
  <text x="548" y="266" class="muted">“从下标 0 开始”的合法子数组！</text>

  <text x="548" y="308" class="label" font-weight="600">2. 查和存顺序写反（先存后查）</text>
  <text x="548" y="332" class="muted">若先 prefix_cnt[cur_sum] += 1 再查，当 k = 0</text>
  <text x="548" y="352" class="muted">时会把自己刚存的值查出来（算成空子数组）！</text>
  <text x="548" y="382" class="mono">铁律：先 ans += ... 再 prefix_cnt[cur_sum] += 1</text>
</svg>
