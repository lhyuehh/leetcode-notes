<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <rect width="960" height="460" fill="#ffffff"/>
  <style>
    .title { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 22px; font-weight: 600; fill: #111827; }
    .h2 { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 16px; font-weight: 600; fill: #1e3a8a; }
    .label { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 15px; fill: #1f2937; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; fill: #1e40af; }
    .muted { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 13px; fill: #6b7280; }
    .warn { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 13px; font-weight: 600; fill: #dc2626; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="480" y="42" text-anchor="middle" class="title">哈希表底层原理：散列函数 + 底层数组 + 拉链法解决冲突</text>

  <text x="86" y="218" text-anchor="middle" class="label">输入 Key</text>
  <text x="86" y="242" text-anchor="middle" class="muted">(例如 7, 12)</text>
  <line x1="140" y1="210" x2="188" y2="210" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="140" y1="242" x2="188" y2="242" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="196" y="168" width="168" height="116" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="280" y="204" text-anchor="middle" class="h2">散列函数</text>
  <text x="280" y="226" text-anchor="middle" class="muted">Hash Function</text>
  <text x="280" y="256" text-anchor="middle" class="mono">hash(k) % 5</text>

  <line x1="364" y1="210" x2="462" y2="222" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="412" y="200" text-anchor="middle" class="mono">7 % 5 = 2</text>
  <line x1="364" y1="246" x2="462" y2="236" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="412" y="264" text-anchor="middle" class="mono">12 % 5 = 2</text>
  <text x="412" y="294" text-anchor="middle" class="warn">哈希冲突 (Collision)!</text>

  <text x="515" y="92" text-anchor="middle" class="label" font-weight="600">底层数组 Buckets [0..4]</text>
  <rect x="470" y="108" width="90" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="515" y="137" text-anchor="middle" class="label">0</text>
  <rect x="470" y="156" width="90" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="515" y="185" text-anchor="middle" class="label">1</text>
  <rect x="470" y="204" width="90" height="48" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="515" y="233" text-anchor="middle" class="h2">2</text>
  <rect x="470" y="252" width="90" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="515" y="281" text-anchor="middle" class="label">3</text>
  <rect x="470" y="300" width="90" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="515" y="329" text-anchor="middle" class="label">4</text>

  <text x="748" y="168" text-anchor="middle" class="label" font-weight="600">拉链法解决冲突（链表）</text>
  <line x1="560" y1="228" x2="612" y2="228" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="620" y="204" width="112" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.6"/>
  <text x="676" y="233" text-anchor="middle" class="mono">7 -&gt; idx 0</text>
  <line x1="732" y1="228" x2="770" y2="228" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="778" y="204" width="118" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.6"/>
  <text x="837" y="233" text-anchor="middle" class="mono">12 -&gt; idx 3</text>
  <line x1="896" y1="228" x2="918" y2="228" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="938" y="233" text-anchor="middle" class="muted">NULL</text>

  <text x="480" y="416" text-anchor="middle" class="muted">核心总结：数组负责 O(1) 定位槽位，链表负责解决碰撞，两者结合实现平均 O(1) 增删查改</text>
</svg>
